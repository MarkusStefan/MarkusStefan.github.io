<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Familiar factors, unseen combinations</title>
  <desc id="desc">A conceptual mass and friction grid. Three combinations are familiar; heavy mass on low friction is held out.</desc>
  <rect width="960" height="600" fill="#fafafa"/>
  <g font-family="system-ui, sans-serif" fill="#17202b">
    <text x="60" y="75" font-size="18" letter-spacing="3">CAUSAL REPRESENTATION LEARNING</text>
    <text x="60" y="135" font-size="36" font-weight="650">Familiar factors. New combinations.</text>
    <text x="285" y="213" font-size="22">Low friction</text>
    <text x="600" y="213" font-size="22">High friction</text>
    <text x="62" y="300" font-size="21">Light</text>
    <text x="62" y="448" font-size="21">Heavy</text>
    <rect x="235" y="240" width="285" height="110" rx="12" fill="#e9eff4" stroke="#0072b2"/>
    <rect x="560" y="240" width="285" height="110" rx="12" fill="#e9eff4" stroke="#0072b2"/>
    <rect x="235" y="390" width="285" height="110" rx="12" fill="#fff2e8" stroke="#d55e00" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="560" y="390" width="285" height="110" rx="12" fill="#e9eff4" stroke="#0072b2"/>
    <text x="310" y="305" font-size="23">Observed</text>
    <text x="635" y="305" font-size="23">Observed</text>
    <text x="305" y="455" font-size="23" fill="#a74300">Held out</text>
    <text x="635" y="455" font-size="23">Observed</text>
    <text x="60" y="555" font-size="18" fill="#596575">Conceptual example from the thesis; not the RQ2 task grid.</text>
  </g>
</svg>
